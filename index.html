    <link rel="canonical" href="https://delta-kronecker.github.io/diba-digital-postcards/" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var isDark = saved ? saved === 'dark' : false;
          if (isDark) document.documentElement.classList.add('dark');
          else document.documentElement.classList.add('light');
        } catch (e) {}

        try {
          var hash = window.location.hash.replace('#', '');
          var onHome = !/\/invite\//.test(window.location.pathname) &&
            (!hash || hash === 'home' || hash === 'gallery' || hash === 'categories');
          if (onHome) {
            var preload = document.createElement('link');
            preload.rel = 'preload';
            preload.as = 'image';
            preload.type = 'image/webp';
            preload.href = '/diba-digital-postcards/images/wedding-cover.webp';
            preload.setAttribute('fetchpriority', 'high');
            document.head.appendChild(preload);
          }
        } catch (e) {}
      })();
    </script>
