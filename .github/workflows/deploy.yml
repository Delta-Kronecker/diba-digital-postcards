name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ۱. پاک کردن فایل‌های قفل و پوشه‌های قدیمی برای جلوگیری از تداخل
      - name: Clean up old dependencies
        run: |
          rm -rf node_modules
          rm -f package-lock.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ۲. نصب وابستگی‌ها (به جای npm ci از npm install استفاده می‌کنیم)
      - name: Install dependencies
        run: npm install

      # ۳. اجرای مستقیم Vite با Node برای دور زدن مشکل مجوز (Permission denied)
      - name: Build project
        run: node node_modules/vite/bin/vite.js build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
